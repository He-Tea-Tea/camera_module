camera_manager:                                # 顶层节点名，和 camera_manager 节点名一致
  ros__parameters:                             # ROS2 参数固定写法，所有参数都必须放在这一节下
    camera_names: [head_camera, wrist_camera]  # 声明本机有两个相机，名字分别是 head_camera 和 wrist_camera

    # ---- 头部 Orbbec 相机配置 ----
    "head_camera.backend": orbbec              # 头相机的驱动后端，选 orbbec 就会加载 OrbbecSDK
    "head_camera.model": Gemini335Le           # 头相机型号，用于日志和识别，方便核对
    "head_camera.serial": "CPEP163000LG"       # 头相机序列号SN，留空表示"不按序列号筛选"；
    "head_camera.ip_address": "192.168.1.20"   # 头相机 IP；走 Ethernet 时填实际地址，或留空让 SDK 自动发现
    "head_camera.component_instance_id": 1     # 头相机在整机里的组件编号，必须唯一、跨重启稳定，方便大脑/小脑对应
    "head_camera.optical_frame": head_camera_color_optical_frame  # 头相机光心坐标系的 TF 名字，供坐标变换使用

    # ---- 腕部 RealSense 相机配置 ----
    "wrist_camera.backend": realsense          # 腕相机驱动后端，选 realsense 就会加载 librealsense
    "wrist_camera.model": D436                 # 腕相机型号，用于日志和识别
    "wrist_camera.serial": "实际序列号"          # 腕相机序列号，RealSense 多机时必填，用 rs-enumerate-devices 查
    "wrist_camera.ip_address": ""              # 腕相机走 USB，不需要 IP，留空
    "wrist_camera.component_instance_id": 2    # 腕相机组件编号，必须和头相机不同
    "wrist_camera.optical_frame": wrist_camera_color_optical_frame  # 腕相机光心坐标系的 TF 名字