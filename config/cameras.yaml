# ROS2 参数文件。序列号或 IP 必须由部署者填写，禁止依赖枚举顺序。
camera_manager:
  ros__parameters:
    camera_names: [head_camera, wrist_camera]

    # 头部 Orbbec Gemini335Le：建议使用固定 IP 或序列号二选一。
    "head_camera.backend": orbbec
    "head_camera.model": Gemini335Le
    "head_camera.serial": ""
    "head_camera.ip_address": "FILL_HEAD_IP_OR_EMPTY"
    "head_camera.optical_frame": head_camera_color_optical_frame
    "head_camera.calibration_revision": "FILL_HEAD_CALIBRATION_REVISION"
    "head_camera.component_instance_id": 1
    "head_camera.color_width": 1280
    "head_camera.color_height": 800
    "head_camera.depth_width": 1280
    "head_camera.depth_height": 800
    "head_camera.fps": 30
    "head_camera.capture_delay_bound_verified": false
    "head_camera.capture_delay_bound_ms": 0
    "head_camera.allow_unbound_device": false

    # 腕部 RealSense D436：必须填写实际序列号。
    "wrist_camera.backend": realsense
    "wrist_camera.model": D436
    "wrist_camera.serial": "FILL_REAL_SERIAL"
    "wrist_camera.ip_address": ""
    "wrist_camera.optical_frame": wrist_camera_color_optical_frame
    "wrist_camera.calibration_revision": "FILL_WRIST_CALIBRATION_REVISION"
    "wrist_camera.component_instance_id": 2
    "wrist_camera.color_width": 640
    "wrist_camera.color_height": 480
    "wrist_camera.depth_width": 640
    "wrist_camera.depth_height": 480
    "wrist_camera.fps": 30
    "wrist_camera.capture_delay_bound_verified": false
    "wrist_camera.capture_delay_bound_ms": 0
    "wrist_camera.allow_unbound_device": false
